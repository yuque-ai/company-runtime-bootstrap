name: publish-frozen-bootstrap-v2-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - company-runtime-runner-bootstrap-v2.sh
      - SHA256SUMS-v2
      - .github/workflows/publish-frozen-bootstrap-v2-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen V2 artifact
        run: |
          echo '13f4db4b0c115e43f3075ab6cba9e90f629226b5f709f1a4678f9a63cfcd57e2  company-runtime-runner-bootstrap-v2.sh' | sha256sum --check --status
          ! grep -E '(BEGIN .*PRIVATE KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)' company-runtime-runner-bootstrap-v2.sh
      - name: Tag and publish V2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bootstrap-v2-13f4db4b
        run: |
          git config user.name 'company-runtime-release-bot'
          git config user.email 'company-runtime-release-bot@users.noreply.github.com'
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            git tag -a "$TAG" -m 'Frozen runner bootstrap V2'
            git push origin "$TAG"
          fi
          gh release view "$TAG" || gh release create "$TAG" company-runtime-runner-bootstrap-v2.sh SHA256SUMS-v2 --title 'Company Runtime Bootstrap V2' --notes 'V2 uses the official explicit config.sh --token registration contract. V1 is deprecated for production registration.'
