name: publish-frozen-bootstrap-v2-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - company-runtime-runner-bootstrap-v2.sh
      - SHA256SUMS-v2
      - .github/workflows/publish-frozen-bootstrap-v2-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen V2 artifact
        run: |
          echo 'c37ddad339911f44fb3868c7ec2b7d277bb77aa685ef9d745507667af8828bf2  company-runtime-runner-bootstrap-v2.sh' | sha256sum --check --status
          ! grep -E '(BEGIN .*PRIVATE KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)' company-runtime-runner-bootstrap-v2.sh
      - name: Tag and publish V2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bootstrap-v2-13f4db4b
        run: |
          git config user.name 'company-runtime-release-bot'
          git config user.email 'company-runtime-release-bot@users.noreply.github.com'
          git tag -a "$TAG" -m 'Frozen runner bootstrap V2'
          git push origin "$TAG"
          gh release create "$TAG" company-runtime-runner-bootstrap-v2.sh SHA256SUMS-v2 --title 'Company Runtime Bootstrap V2' --notes 'V2 uses the official explicit config.sh --token registration contract. V1 is deprecated for production registration.'
