name: publish-frozen-bootstrap-v2-1-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - company-runtime-runner-bootstrap-v2.1.sh
      - SHA256SUMS-v2.1
      - .github/workflows/publish-frozen-bootstrap-v2-1-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen V2.1 asset
        run: |
          echo '5a89769e2e60d92ee09ba986b4a69b2433269cc9ec8d7be1c2cdb9fc1b280d5f  company-runtime-runner-bootstrap-v2.1.sh' | sha256sum --check --status
          ! grep -E '(BEGIN .*PRIVATE KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)' company-runtime-runner-bootstrap-v2.1.sh
      - name: Tag and publish V2.1
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bootstrap-v2-1-5a89769e
        run: |
          git config user.name 'company-runtime-release-bot'
          git config user.email 'company-runtime-release-bot@users.noreply.github.com'
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            git tag -a "$TAG" -m 'Frozen runner bootstrap V2.1'
            git push origin "$TAG"
          fi
          gh release view "$TAG" || gh release create "$TAG" company-runtime-runner-bootstrap-v2.1.sh SHA256SUMS-v2.1 --title 'Company Runtime Bootstrap V2.1' --notes 'V2.1 replaces HEAD-only network preflight with bounded HTTPS GET probes. V2 is superseded for production.'
